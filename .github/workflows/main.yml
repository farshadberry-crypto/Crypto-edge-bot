name: Crypto Edge Auto Bot

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Requests
        run: pip install requests

      - name: Run Market Update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Run Crypto News
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python news.py

      - name: Save News History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .crypto_edge_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update crypto news history"
            git push
          else
            echo "News history unchanged."
          fi
