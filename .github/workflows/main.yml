name: Crypto Edge Auto Bot

'on':
workflow_dispatch:
schedule:
- cron: '0 * * * *'

jobs:
test:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Restore News Memory
    uses: actions/cache/restore@v4
    with:
      path: .crypto_edge_seen.json
      key: crypto-edge-seen-${{ github.run_id }}
      restore-keys: |
        crypto-edge-seen-

  - name: Install Requests
    run: pip install requests

  - name: Run Market Update
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    run: python bot.py

  - name: Run Crypto News
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    run: python news.py

  - name: Save News Memory
    if: always()
    uses: actions/cache/save@v4
    with:
      path: .crypto_edge_seen.json
      key: crypto-edge-seen-${{ github.run_id }}
```
